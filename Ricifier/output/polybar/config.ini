# Generated by ricifier. Review before using.
# Built-in modules are intentionally static and do not execute shell commands.
[colors]
background = #635517
foreground = #efe3d7
accent = #b39f31
background_alt = #897221
secondary = #d3b7bc
disabled = #897221
alert = #d3b7bc
tray_background = #635517
tray_foreground = #efe3d7

[bar/main]
width = 100%
fixed-center = true
padding-left = 1
padding-right = 1
module-margin-left = 8
module-margin-right = 8
wm-restack = i3
enable-ipc = true
screenchange-reload = true
separator-foreground = ${colors.disabled}
height = 36
radius = 12
line-size = 3
border-size = 2
offset-x = 12
offset-y = 12
background = ${colors.background}
foreground = ${colors.foreground}
border-color = #00000000
font-0 = JetBrains Mono:size=11;2
font-1 = monospace:size=11;2
modules-left = i3 xwindow
modules-right = xkeyboard wlan eth filesystem pulseaudio date tray
modules-center = cpu memory
module-spacing = 8
separator = ·

[module/i3]
type = internal/i3
format = <label-state><label-mode>
format-padding = 10
label = %name%
label-focused = %name%
label-focused-padding = 4
label-focused-foreground = ${colors.accent}
label-focused-background = ${colors.background}
label-focused-underline = ${colors.accent}
label-unfocused = %name%
label-unfocused-padding = 4
label-unfocused-foreground = ${colors.foreground}
label-unfocused-background = ${colors.background}
label-visible = %name%
label-visible-padding = 4
label-visible-foreground = ${colors.foreground}
label-visible-background = ${colors.background}
label-visible-underline = ${colors.secondary}
label-urgent = %name%
label-urgent-padding = 4
label-urgent-foreground = ${colors.accent}
label-urgent-background = ${colors.background}
label-urgent-underline = ${colors.alert}
label-empty = %name%
label-empty-padding = 4
label-empty-foreground = ${colors.disabled}
label-empty-background = ${colors.background}
label-mode = %mode%
label-mode-padding = 1
label-mode-foreground = ${colors.accent}
label-mode-background = ${colors.background}

[module/xwindow]
type = internal/xwindow
label = %title:0:60:...%
label-foreground = ${colors.foreground}

[module/cpu]
type = internal/cpu
interval = 2
format = <label>
format-padding = 10
format-prefix = CPU 
format-prefix-foreground = ${colors.accent}
label = %percentage:2%%

[module/memory]
type = internal/memory
interval = 2
format = <label>
format-padding = 10
format-prefix = RAM 
format-prefix-foreground = ${colors.accent}
label = %percentage_used:2%%

[module/date]
type = internal/date
interval = 5
format = <label>
format-padding = 10
date = %a %H:%M
label = %date%
label-foreground = ${colors.foreground}

[module/pulseaudio]
type = internal/pulseaudio
use-ui-max = true
interval = 2
format-volume = <label-volume>
format-padding = 10
format-volume-prefix = VOL 
format-volume-prefix-foreground = ${colors.accent}
label-volume = %percentage:2%%
format-muted = <label-muted>
label-muted = muted
label-muted-foreground = ${colors.accent}

[module/filesystem]
type = internal/fs
mount-0 = /
interval = 30
format-mounted = <label-mounted>
format-padding = 10
format-mounted-prefix = DISK 
format-mounted-prefix-foreground = ${colors.accent}
label-mounted = %percentage_used:2%%

[module/xkeyboard]
type = internal/xkeyboard
blacklist-0 = num lock
label-layout = %layout%
label-layout-foreground = ${colors.secondary}
label-indicator-padding = 1
label-indicator-margin = 1
label-indicator-foreground = ${colors.background}
label-indicator-background = ${colors.secondary}

[network-base]
type = internal/network
interval = 5
format-connected = <label-connected>
format-disconnected = <label-disconnected>
label-disconnected = offline
label-disconnected-foreground = ${colors.disabled}

[module/wlan]
inherit = network-base
interface-type = wireless
label-connected = %essid% %local_ip%
label-connected-foreground = ${colors.foreground}

[module/eth]
inherit = network-base
interface-type = wired
label-connected = %local_ip%
label-connected-foreground = ${colors.foreground}

[module/tray]
type = internal/tray
format = <tray>
tray-spacing = 1
tray-size = 50%
tray-foreground = ${colors.foreground}
tray-background = ${colors.background}
