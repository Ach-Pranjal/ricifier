# Generated by ricifier. A minimal standalone bar for previewing.
# Merge the colors and sizes into your own config rather than replacing it.
[colors]
background = #862e2e
foreground = #8ec2ec
accent = #f57272

[bar/main]
width = 100%
height = 36
radius = 4
background = ${colors.background}
foreground = ${colors.foreground}
font-0 = monospace:size=11;2
font-1 = monospace:size=11;2
modules-left = i3
modules-right = pulseaudio date
tray-position = right
module-margin = 8
modules-center = date

[module/date]
type = internal/date
interval = 5
date = %a %H:%M
label = %date%
